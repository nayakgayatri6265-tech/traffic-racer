
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Racer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101827;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 2;
}

.box {
    background: rgba(0,0,0,0.7);
    padding: 13px 20px;
    border-radius: 12px;
    min-width: 130px;
    border: 1px solid #ffffff22;
}

.box small {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
}

.box strong {
    font-size: 24px;
    color: #facc15;
}

#pause {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #facc15;
    color: #111827;
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    z-index: 3;
}

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 4;
}

#panel {
    text-align: center;
    padding: 35px;
    background: #172033;
    border-radius: 20px;
    border: 1px solid #ffffff22;
    width: 90%;
    max-width: 400px;
}

#panel h1 {
    font-size: 36px;
    color: #facc15;
    margin-bottom: 12px;
}

#panel p {
    margin-bottom: 20px;
    color: #cbd5e1;
}

#startBtn {
    background: #facc15;
    border: none;
    padding: 13px 35px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 2;
    pointer-events: none;
}

.controlGroup {
    display: flex;
    gap: 15px;
}

.control {
    width: 70px;
    height: 70px;
    border-radius: 15px;
    border: 2px solid white;
    background: rgba(0,0,0,.45);
    color: white;
    font-size: 28px;
    pointer-events: auto;
    touch-action: none;
}

.control:active {
    background: #facc15;
    color: black;
}

@media (max-width: 600px) {
    .box {
        min-width: 90px;
        padding: 10px;
    }

    .box strong {
        font-size: 18px;
    }

    .control {
        width: 60px;
        height: 60px;
    }
}
</style>
</head>

<body>

<div id="hud">
    <div class="box">
        <small>SCORE</small>
        <strong id="score">0</strong>
    </div>

    <div class="box">
        <small>SPEED</small>
        <strong id="speed">0</strong>
    </div>

    <div class="box">
        <small>BEST</small>
        <strong id="best">0</strong>
    </div>
</div>

<button id="pause" onclick="togglePause()">Ⅱ</button>

<div id="overlay">
    <div id="panel">
        <h1>TRAFFIC RACER</h1>
        <p id="message">Avoid traffic and drive as far as you can!</p>
        <button id="startBtn" onclick="startGame()">START RACE</button>
    </div>
</div>

<div id="controls">
    <div class="controlGroup">
        <button class="control" id="left">◀</button>
        <button class="control" id="right">▶</button>
    </div>

    <div class="controlGroup">
        <button class="control" id="brake">▼</button>
        <button class="control" id="gas">▲</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Game state
let running = false;
let paused = false;
let gameOver = false;

let score = 0;
let speed = 5;
let roadOffset = 0;
let spawnTimer = 0;

let best = Number(localStorage.getItem("trafficBest")) || 0;

document.getElementById("best").textContent = best;

const player = {
    x: 0,
    y: 0,
    width: 48,
    height: 85
};

let traffic = [];

const keys = {
    left: false,
    right: false,
    gas: false,
    brake: false
};

const carColors = [
    "#3b82f6",
    "#22c55e",
    "#f97316",
    "#a855f7",
    "#e11d48",
    "#f8fafc"
];

// Road properties
function roadWidth() {
    return Math.min(W * 0.65, 500);
}

function roadLeft() {
    return (W - roadWidth()) / 2;
}

function laneWidth() {
    return roadWidth() / 3;
}

function laneCenter(lane) {
    return roadLeft() + laneWidth() * lane + laneWidth() / 2;
}

// Draw road
function drawRoad() {
    // Grass
    ctx.fillStyle = "#23753c";
    ctx.fillRect(0, 0, W, H);

    // Grass details
    for (let i = 0; i < 12; i++) {
        let y = (i * 100 + roadOffset * 2) % H;

        ctx.fillStyle = "#2d8548";
        ctx.fillRect(0, y, roadLeft(), 30);

        ctx.fillRect(
            roadLeft() + roadWidth(),
            y,
            roadLeft(),
            30
        );
    }

    // Road
    ctx.fillStyle = "#34383e";
    ctx.fillRect(roadLeft(), 0, roadWidth(), H);

    // Road edges
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(roadLeft(), 0, 5, H);
    ctx.fillRect(roadLeft() + roadWidth() - 5, 0, 5, H);

    // Lane markings
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.setLineDash([35, 35]);

    ctx.lineDashOffset = -roadOffset;

    for (let i = 1; i <= 2; i++) {
        let x = roadLeft() + laneWidth() * i;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    ctx.setLineDash([]);
}

// Draw car
function drawCar(x, y, width, height, color, isPlayer = false) {
    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(x + 5, y + 5, width, height);

    // Car body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, 10);
    ctx.fill();

    // Windshield
    ctx.fillStyle = "#152b45";
    ctx.beginPath();
    ctx.roundRect(
        x + 7,
        y + height * 0.2,
        width - 14,
        height * 0.27,
        7
    );
    ctx.fill();

    // Rear window
    ctx.fillStyle = "#1e3a5f";
    ctx.fillRect(
        x + 8,
        y + height * 0.57,
        width - 16,
        height * 0.15
    );

    // Headlights / taillights
    ctx.fillStyle = isPlayer ? "#ef4444" : "#fef08a";
    ctx.fillRect(x + 5, y + height - 10, 9, 6);
    ctx.fillRect(x + width - 14, y + height - 10, 9, 6);

    // Wheels
    ctx.fillStyle = "#111827";
    ctx.fillRect(x - 4, y + 14, 5, 17);
    ctx.fillRect(x + width - 1, y + 14, 5, 17);

    ctx.fillRect(x - 4, y + height - 30, 5, 17);
    ctx.fillRect(x + width - 1, y + height - 30, 5, 17);

    // Spoiler
    if (isPlayer) {
        ctx.fillStyle = "#111827";
        ctx.fillRect(x - 3, y + height - 17, width + 6, 5);
    }
}

// Spawn traffic
function spawnTraffic() {
    const lane = Math.floor(Math.random() * 3);

    // Avoid spawning too close to existing cars
    const tooClose = traffic.some(car =>
        car.lane === lane && car.y < 170
    );

    if (tooClose) return;

    traffic.push({
        lane: lane,
        x: laneCenter(lane) - 24,
        y: -100,
        width: 48,
        height: 80,
        color: carColors[
            Math.floor(Math.random() * carColors.length)
        ],
        speed: 2 + Math.random() * 2
    });
}

// Start game
function startGame() {
    score = 0;
    speed = 5;
    roadOffset = 0;
    spawnTimer = 0;
    traffic = [];

    player.x = W / 2 - player.width / 2;
    player.y = H - 140;

    running = true;
    paused = false;
    gameOver = false;

    document.getElementById("overlay").style.display = "none";

    document.getElementById("pause").textContent = "Ⅱ";
}

// Pause game
function togglePause() {
    if (!running || gameOver) return;

    paused = !paused;

    if (paused) {
        document.getElementById("overlay").style.display = "flex";
        document.querySelector("#panel h1").textContent = "PAUSED";
        document.getElementById("message").textContent =
            "Take a break, racer!";
        document.getElementById("startBtn").textContent = "RESUME";
        document.getElementById("startBtn").onclick = startGame;
    } else {
        document.getElementById("overlay").style.display = "none";
    }
}

// Game over
function endGame() {
    running = false;
    gameOver = true;

    if (score > best) {
        best = score;
        localStorage.setItem("trafficBest", best);
    }

    document.getElementById("best").textContent = best;

    document.querySelector("#panel h1").textContent = "GAME OVER";
    document.getElementById("message").textContent =
        "Your score: " + Math.floor(score);

    document.getElementById("startBtn").textContent = "PLAY AGAIN";
    document.getElementById("startBtn").onclick = startGame;

    document.getElementById("overlay").style.display = "flex";
}

// Keyboard
window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    if (e.key === "ArrowUp" || e.key === "w") keys.gas = true;
    if (e.key === "ArrowDown" || e.key === "s") keys.brake = true;

    if (e.key === "Escape") togglePause();
});

window.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    if (e.key === "ArrowUp" || e.key === "w") keys.gas = false;
    if (e.key === "ArrowDown" || e.key === "s") keys.brake = false;
});

// Mobile buttons
function bindButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("pointerup", () => {
        keys[key] = false;
    });

    button.addEventListener("pointerleave", () => {
        keys[key] = false;
    });

    button.addEventListener("pointercancel", () => {
        keys[key] = false;
    });
}

bindButton("left", "left");
bindButton("right", "right");
bindButton("gas", "gas");
bindButton("brake", "brake");

// Collision
function collision(a, b) {
    return (
        a.x + 8 < b.x + b.width - 8 &&
        a.x + a.width - 8 > b.x + 8 &&
        a.y + 10 < b.y + b.height - 10 &&
        a.y + a.height - 10 > b.y + 10
    );
}

// Update game
function update() {
    if (!running || paused) return;

    // Speed
    if (keys.gas) speed = Math.min(speed + 0.12, 14);
    else if (keys.brake) speed = Math.max(speed - 0.15, 2);
    else speed = Math.min(speed + 0.02, 8);

    // Steering
    const steer = 6 + speed * 0.15;

    if (keys.left) player.x -= steer;
    if (keys.right) player.x += steer;

    // Keep player inside road
    const leftLimit = roadLeft() + 10;
    const rightLimit = roadLeft() + roadWidth() - player.width - 10;

    player.x = Math.max(leftLimit, Math.min(rightLimit, player.x));

    // Road animation
    roadOffset += speed;
    if (roadOffset > 70) roadOffset = 0;

    // Score
    score += speed * 0.03;

    // Traffic spawn
    spawnTimer++;

    if (spawnTimer > Math.max(25, 75 - speed * 3)) {
        spawnTraffic();
        spawnTimer = 0;
    }

    // Update traffic
    traffic.forEach(car => {
        car.y += speed - car.speed;
    });

    traffic = traffic.filter(car => car.y < H + 120);

    // Collision check
    for (const car of traffic) {
        if (collision(player, car)) {
            endGame();
            return;
        }
    }

    // HUD
    document.getElementById("score").textContent = Math.floor(score);
    document.getElementById("speed").textContent = Math.floor(speed * 20);
}

// Render
function draw() {
    ctx.clearRect(0, 0, W, H);

    drawRoad();

    // Traffic
    traffic.forEach(car => {
        drawCar(
            car.x,
            car.y,
            car.width,
            car.height,
            car.color
        );
    });

    // Player
    drawCar(
        player.x,
        player.y,
        player.width,
        player.height,
        "#ef233c",
        true
    );
}

// Game loop
function loop() {
    update();
    draw();

    requestAnimationFrame(loop);
}

// Initialize
player.x = W / 2 - player.width / 2;
player.y = H - 140;

loop();
</script>

</body>
</html>
